# E4 Multi-feature stop detection fusion configuration (Enabled)
enabled: true

# Candidate stop frames must occur on or after landing_frame / battle_start_frame
min_battle_frame: true

# Multi-feature still stop parameters
still_frames: 12
still_moving_px: 3.8
still_max_rot_rate_deg: 0.3
still_min_laplacian_var: 80.0

# Precession noise suppression for reversal stops
reverse_min_laplacian_var: 180.0

# Terminal stop persistence guard (pixels across stadium before considering motion resumed)
terminal_motion_guard_px: 45.0

# E4b continuous-approach guard (default off). A stop candidate is rejected unless the
# top was observed in every one of the preceding frames. A gap right before a "stop"
# means occlusion (typically a hand taking the top), not a battle stop.
continuous_approach_guard_enabled: false
continuous_approach_frames: 30  # 0.25 s at 120 FPS; physical choice, not fitted to holdout
