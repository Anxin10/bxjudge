# Both adapters accept decoder BGR uint8 HWC frames.
confidence: 0.3  # Minimum score for adjudication evidence; unchanged.
candidate_confidence: 0.3  # Keep the proven operating point; 0.1 trial did not improve real tracking.
evaluation_confidence: 0.001
device: cuda:0
# Process-wide OpenCV budget, applied after framework initialization, before decoding.
# Four threads reduced warm full-pipeline time in balanced original-footage trials.
opencv_threads: 4
selection_tie_ap: 0.01  # AP is on [0, 1]; one percentage point.
latency_warmup_frames: 2
tracking:
  lost_track_buffer: 30
  track_activation_threshold: 0.3
  minimum_consecutive_frames: 1
  minimum_iou_threshold: 0.1
  high_conf_det_threshold: 0.3
# Production training policy (R57), the default of `bxjudge train`. The synthetic smoke
# policy lives only in config/detection_smoke.yaml, selected by --training-policy.
training:
  policy: production
  # Derived: thresholds.yaml infer_long_edge rounded to the nearest size each framework
  # accepts (RF-DETR Nano multiple of 32, YOLO imgsz multiple of stride 32): 1280 today.
  image_size: infer_long_edge
  epochs: 100
  rfdetr:
    model: {}
    fit:
      # Measured on the RTX 3090 (runs/rereview-c-*): total card use < 21 GiB incl. desktop.
      # batch 4 crept 14.9 -> 17.1 GiB over 160 multi-scale iterations (allocator
      # fragmentation); batch 2 keeps long real runs far from the 21 GiB budget.
      batch_size: 2
      grad_accum_steps: 8  # effective batch 16 (framework recommendation)
      num_workers: 2
      amp_dtype: bf16
      # Framework-default augmentation: per-batch multi-scale (expanded scales reach
      # +5 blocks above image_size), scale jitter, default flips/crops.
      multi_scale: true
      expanded_scales: true
      scale_jitter: true
      use_ema: true
      tensorboard: false
      wandb: false
      mlflow: false
      clearml: false
      run_test: false
      log_per_class_metrics: true
      save_dataset_grids: false
  yolo26:
    model: runs/pretrained/yolo26n.pt
    fit:
      batch: 16  # measured, see rfdetr batch_size note
      nbs: 64  # nominal batch: Ultralytics accumulates round(nbs / batch) batches
      workers: 4
      amp: true
      seed: 42
      deterministic: true
      plots: false
      save: true
      val: true
      pretrained: true
      patience: 100
      # Ultralytics detection-augmentation defaults, pinned explicitly. Horizontal flip
      # is safe: classes are side-agnostic; X/B sides come from geometry, not the detector.
      mosaic: 1.0
      close_mosaic: 10
      mixup: 0.0
      fliplr: 0.5
      hsv_h: 0.015
      hsv_s: 0.7
      hsv_v: 0.4
      translate: 0.1
      scale: 0.5
