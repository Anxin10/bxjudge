# Automatic stadium finding from the green rail
# (spec docs/superpowers/specs/2026-11-11-auto-stadium-design.md).
# Pixel distances are in "inference px": the frame scaled so its long edge is 1280.

# Manual calibration in calib/ the canonical stadium model is built from (read only).
model_template: "20261014_202713"
# Rail points kept in the canonical model.
model_points: 400
# Margin added around the template's battle_area when extracting the template rail, as a
# fraction of the template frame width (keeps green outside the stadium out of the model).
roi_margin_frac: 0.05

# --- rail colour (OpenCV HSV: hue 0-179, saturation/value 0-255)
# Hue range searched for the rail; the per-frame peak inside it sets the actual threshold.
hue_search: [30, 90]
# Half width of the accepted hue band around the per-frame peak.
hue_halfwidth: 12
min_saturation: 60
min_value: 60
# A rail component is a band: mean thickness (2 * area / perimeter, as a fraction of the
# frame long edge) at most max_thickness_frac, and length / thickness (perimeter^2 / 4 area)
# at least min_elongation. Solid blobs such as gloves fail the elongation test.
max_thickness_frac: 0.06
min_elongation: 5.0
# Components smaller than this fraction of the frame area are noise.
min_component_frac: 0.0001

# --- frame choice (seconds of physical source time)
sample_window_s: 6.0
sample_step_s: 0.25
candidate_frames: 5

# --- fitting
# Width the coarse search runs at (px).
work_width: 480
coarse_rotation_step_deg: 5.0
coarse_scale_min: 0.5
coarse_scale_max: 1.8
coarse_scale_steps: 9
coarse_top_k: 5
refine_iterations: 150
# A model rail point within this distance of rail evidence counts as matched (inference px).
inlier_px: 6.0
# Minimum share of model rail points matched, and of rail evidence explained by the model.
min_coverage: 0.8
# Provisional (2026-11-11): the transparent lid refracts a second image of the rail that the
# model cannot explain, so real fits score 0.4-0.7 here; re-derive with manual truth.
min_precision: 0.3
# Minimum share of the fitted model rail that lies inside the frame (coverage and precision
# are measured on the in-frame part, so a rail mostly outside the frame cannot be trusted).
min_rail_in_frame: 0.5
# After the affine fit, a full homography is tried. It is kept only when coverage x
# precision does not drop, the mean distance of the model rail to the frame's rail centre
# line shrinks by at least perspective_min_gain_px (inference px), and its perspective terms
# max(|h20|, |h21|) (inference px, h22 = 1) stay within max_perspective: an oval alone
# cannot pin perspective, the rail's straight sides and notch can.
max_perspective: 0.001
perspective_min_gain_px: 0.5
# Fits from two candidate frames agree when their zones differ by at most this (inference px).
agreement_px: 8.0
# A pocket whose in-frame area share is below this gets zone_out_of_frame@<zone>.
zone_visible_min: 0.8
