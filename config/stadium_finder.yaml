# Automatic stadium finding from the green rail
# (spec docs/superpowers/specs/2026-11-11-auto-stadium-design.md).
# Pixel distances are in "inference px": the frame scaled so its long edge is 1280.

# Manual calibration in calib/ the canonical stadium model is built from (read only).
model_template: "20261014_202713"
# Rail points kept in the canonical model.
model_points: 400
# Margin added around the template's battle_area when extracting the template rail, as a
# fraction of the template frame width (keeps green outside the stadium out of the model).
roi_margin_frac: 0.05

# --- rail colour (OpenCV HSV: hue 0-179, saturation/value 0-255)
# Hue range searched for the rail; the per-frame peak inside it sets the actual threshold.
hue_search: [30, 90]
# Half width of the accepted hue band around the per-frame peak.
hue_halfwidth: 12
min_saturation: 60
min_value: 60
# A rail component is a band: mean thickness (2 * area / perimeter, as a fraction of the
# frame long edge) at most max_thickness_frac, and length / thickness (perimeter^2 / 4 area)
# at least min_elongation. Solid blobs such as gloves fail the elongation test.
max_thickness_frac: 0.06
min_elongation: 5.0
# Components smaller than this fraction of the frame area are noise.
min_component_frac: 0.0001

# --- frame choice (seconds of physical source time)
sample_window_s: 6.0
sample_step_s: 0.25
candidate_frames: 5

# --- fitting
# Width the coarse search runs at (px).
work_width: 480
coarse_rotation_step_deg: 5.0
coarse_scale_min: 0.5
coarse_scale_max: 1.8
coarse_scale_steps: 9
coarse_top_k: 5
refine_iterations: 150
# A model rail point within this distance of rail evidence counts as matched (inference px).
inlier_px: 6.0
# Minimum share of model rail points matched, and of rail evidence explained by the model.
min_coverage: 0.8
# Provisional (2026-11-11): the transparent lid refracts a second image of the rail that the
# model cannot explain, so real fits score 0.4-0.7 here; re-derive with manual truth.
min_precision: 0.3
# Minimum share of the fitted model rail that lies inside the frame (coverage and precision
# are measured on the in-frame part, so a rail mostly outside the frame cannot be trusted).
min_rail_in_frame: 0.5
# The direction and every side must be seen (Codex review 2026-11-11): a plain ring cannot
# tell 0 from 180 degrees (X/B and Xtreme would swap), and a rail cut off on one side leaves
# that side's zones free. Matched shares, points outside the frame counting as unmatched:
# the cat-ear notch (near half, within notch_halfwidth_frac of the rail width from the
# centre) and the weakest of the four quadrants left/right x near/far.
notch_halfwidth_frac: 0.2
# Part of the notch must be seen (11/08 close-ups cut the near end off at the bottom edge);
# the direction itself is then checked against the fit turned 180 degrees: that alternative,
# refined, must explain the rail clearly worse (coverage x precision lower by at least
# orientation_min_gain), or the direction is ambiguous and nothing is returned.
min_notch_coverage: 0.3
min_quadrant_coverage: 0.5
orientation_min_gain: 0.2
# After the affine fit, a full homography is tried. It is kept only when coverage x
# precision drops by less than 0.02 (implementation tie, ledger Low 7), the mean distance of the model rail to the frame's rail centre
# line shrinks by at least perspective_min_gain_px (inference px), and its perspective terms
# max(|h20|, |h21|) (inference px, h22 = 1) stay within max_perspective: an oval alone
# cannot pin perspective, the rail's straight sides and notch can.
max_perspective: 0.001
perspective_min_gain_px: 0.5
# Edge refinement (the stadium's lid, pockets and outline, as autocalib aligns templates)
# may move the zones at most this far (mean, inference px) from the rail fit it starts from;
# a larger move means the edges disagree with the rail and the candidate is dropped.
edge_max_shift_px: 40.0
# Off (2026-11-11): edges from the one model template only match its own scene (edge score
# 0.86); across other boxes and camera heights they score 0.15-0.39 (lid parallax, different
# surroundings), so find_stadium would refuse nearly every new video. Kept for per-setup
# templates; fit_stadium still refines when a caller passes the frame.
edge_refinement: false
# Fits from two candidate frames agree when their zones differ by at most this (inference px).
agreement_px: 8.0
# A pocket whose in-frame area share is below this gets zone_out_of_frame@<zone>.
zone_visible_min: 0.8

# --- keypoint path (plan docs/superpowers/plans/2026-11-11-stadium-keypoints.md, K4/K5)
# Used only when a caller passes a KeypointFinder (scripts/eval_stadium_finder.py --keypoints).
# Ensemble of 4 YOLO pose models (yolo26n, the final epoch of each run; best.pt is chosen by
# a pose mAP that saturates early, so it is close to arbitrary). Trained 2026-11-12 on 123 of
# the user's 147 labelled frames (Label Studio project 4), 24 held out; provenance in
# weights/stadium-keypoints-20261112/manifest.json. Paths are relative to the project.
keypoint_weights:
  - weights/stadium-keypoints-20261112/run.pt
  - weights/stadium-keypoints-20261112/run_aug.pt
  - weights/stadium-keypoints-20261112/run_s1.pt
  - weights/stadium-keypoints-20261112/run_s2.pt
keypoint_imgsz: 960
# Points the ensemble is less sure of (mean confidence, mirrored predictions included) are
# not used; occluded and out-of-frame points come out low.
keypoint_min_conf: 0.5
# RANSAC inlier distance (inference px). The 10 points are not on one plane: with the user's
# own labels a single homography leaves 8.7 px median residual (inference px), corner points
# 7a/8a/8b up to 24-38 px; 8, 12 and 20 px gave the same zones on the validation images.
keypoint_ransac_px: 15.0
keypoint_min_inliers: 5
# Provisional (2026-11-12): user-label homographies have mean residual p90 13 px, max 34 px.
keypoint_max_error_px: 20.0
# The keypoints pin perspective (user-label fits: median 0.00013, max 0.00134), so the limit
# only catches gross errors.
keypoint_max_perspective: 0.003
# Per point, every confident prediction of the 8 (4 models x direct/mirrored) must lie within
# this distance (inference px) of their mean position, or the point is not used. The same
# measure (largest distance from the mean) on the 147 labelled frames: median 15, p90 37,
# p99 106 px. Provisional.
keypoint_max_spread_px: 60.0
# Homography refinement on the rail, started from the keypoint fit, may move EACH judged zone
# (battle area, both Over pockets, Xtreme) at most this far: per zone the mean vertex
# distance, the worst zone counts (inference px). Codex re-review 2026-11-12 High: a
# consistent 45 px shift passed the coverage checks; then one pocket 42 px off passed a
# 32 px bound on the mean over all zones.
# The rail is a coarse check, not the truth: on the labelled frames the rail-refined fit is
# further from the user's labels than the keypoint fit (worst zone median 19 vs 13 px), and
# refinement moves the worst zone of correct keypoint fits by a median 20, p95 41 px (val
# max 38.5). So this bound catches gross errors only: an accepted fit has every zone within
# this distance of where the rail pulls it, and finer accuracy rests on the keypoints
# (worst zone vs labels: median 13, p95 ~29 px). Provisional.
keypoint_max_rail_shift_px: 40.0
# The rail is independent evidence for the view the points describe (Codex review 2026-11-12
# High: consistent wrong points turned 180 degrees or shifted 50 px passed at coverage
# 0.37-0.43, precision 0.31-0.33). Keypoint fits on the 147 labelled frames: coverage p5 0.47
# p10 0.58 median 0.91, precision min 0.22 p5 0.42 median 0.64. Provisional (2026-11-12);
# re-derive with independent zone truth. The turned fit is also checked (as the rail path).
keypoint_min_rail_coverage: 0.45
keypoint_min_rail_precision: 0.3
# Two candidate frames' keypoint fits agree when their zones differ by at most this (mean,
# inference px). Provisional, wider than agreement_px: points scatter more frame to frame
# than the rail fit.
keypoint_agreement_px: 12.0

# --- E9 later reference windows (default off). When the first sample_window_s finds no
# stadium (e.g. a scoreboard overlay at the start), retry the next windows of the same
# length starting no later than later_windows_max_start_s. Fixed cameras only (the caller
# decides); every window still needs two agreeing fits.
later_windows_enabled: false
later_windows_max_start_s: 30.0
