# Per-round reconstruction of two physical tops; no adjudication from predictions.
max_targets: 2
pair_confirmation_frames: 2
duplicate_iou: 0.6
position_weight: 2.0
appearance_weight: 1.0
native_id_bonus: 0.25
unmatched_cost: 1.5
initial_separation_ratio: 0.7
kalman_process_noise: 0.01
kalman_measurement_noise: 0.1
position_gate_ratio: 0.4
appearance_gate: 0.8
appearance_bins: [8, 4, 4]
appearance_update_alpha: 0.05
missing_velocity_decay: 0.8
min_frame_border_px: 1.0
merge_observation_max_gap_s: 0.15
merge_center_margin_ratio: 0.15
# Post-merge re-anchoring (task 5). Each cue votes only past its margin; a
# conflict, or no vote at all, leaves both identities unknown.
reanchor_motion_max_gap_s: 0.2
reanchor_motion_margin: 0.5
reanchor_appearance_min_separation: 0.3
reanchor_appearance_margin: 0.15
# Association repairs (task 7). A box at least this fraction inside an observed
# top's box, while both tops are observed, is a second box of that top.
duplicate_containment: 0.8
# Ordinary matching after this loss duration leaves the player unknown too.
# With the other slot observed, the sole disjoint leftover can also restore
# spatial tracking after consecutive confirmation (never player identity).
reacquire_min_gap_s: 1.0
reacquire_confirm_frames: 5
reacquire_min_score: 0.5
