[project]
name = "bxjudge"
version = "0.1.0"
description = "Local AI referee for Beyblade X match videos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "opencv-python",
    "pyyaml",
]

[project.scripts]
bxjudge = "bxjudge.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bxjudge"]

[tool.uv]
default-groups = ["dev"]

# PyTorch stable 2.14.x, CUDA 13.2 wheels (the only CUDA 13.x option on
# pytorch.org "Get Started" for Linux/Pip). Wheels bundle CUDA runtime.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires an NVIDIA GPU / CUDA",
    "slow: slow test (long-running)",
]
