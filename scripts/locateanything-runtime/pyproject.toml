[project]
name = "bxjudge-locateanything-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==4.57.1",
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "pillow==11.1.0",
  "peft==0.21.3",
  "decord==0.6.0",
  "lmdb==1.7.5",
  "huggingface-hub==0.36.2",
  "accelerate==1.15.0",
  "pyyaml==6.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
