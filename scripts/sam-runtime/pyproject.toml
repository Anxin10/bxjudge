[project]
name = "bxjudge-sam-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sam3",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "setuptools<81",
  "einops",
  "pyyaml",
  "pycocotools>=2.0.11",
  "psutil>=7.2.2",
]

[tool.uv.sources]
sam3 = { git = "https://github.com/facebookresearch/sam3.git", rev = "7f473cfd983d5eb43040ff608f66bff0d7bdcb53" }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
